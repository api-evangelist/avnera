description: Avnera Corporation was a fabless semiconductor company founded in 2004 and headquartered
  in Beaverton, Oregon, that designed low-power analog and mixed-signal integrated circuits and audio
  system-on-chip (SoC) solutions for wireless headphones, headsets, soundbars, speakers, and gaming
  audio devices. Backed by venture investors including Redpoint Ventures, Avnera was acquired by Skyworks
  Solutions in 2017 and now operates as part of Skyworks. It maintains no independent developer program
  or public API surface; the avnera.com domain resolves to a parked/inactive page with no product site.
